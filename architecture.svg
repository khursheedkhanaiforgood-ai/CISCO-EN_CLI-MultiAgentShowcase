<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">CISCO-EN CLI Mapping Agent — Architecture</text>

  <!-- UI -->
  <rect x="30" y="60" width="900" height="56" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="480" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Streamlit UI</text>
  <text x="480" y="103" text-anchor="middle" font-size="13" fill="#333">AI Query  ·  E2E Design Wizard  ·  DB Browser (9 bin tabs)  ·  Add Data</text>

  <!-- Orchestrator -->
  <rect x="30" y="150" width="430" height="200" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="245" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Orchestrator (single query)</text>
  <text x="50" y="200" font-size="13" fill="#333">1. Classify query into 1 of 9 functional bins</text>
  <text x="50" y="222" font-size="13" fill="#333">2. Semantic search, scoped to that bin</text>
  <text x="50" y="244" font-size="13" fill="#333">3. Fallback: search the full database</text>
  <text x="50" y="266" font-size="13" fill="#333">4. Claude + system prompt + bin guardrails</text>
  <text x="50" y="296" font-size="13" fill="#333">Output: 6-OS comparison table, platform</text>
  <text x="50" y="316" font-size="13" fill="#333">differences, negation / undo forms</text>

  <!-- E2E -->
  <rect x="500" y="150" width="430" height="200" rx="8" fill="#f8fafc" stroke="#334155"/>
  <text x="715" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">E2E Lead Agent (design intent)</text>
  <text x="520" y="200" font-size="13" fill="#333">1. Detect which bins the intent needs</text>
  <text x="520" y="222" font-size="13" fill="#333">2. Query each bin in deployment order</text>
  <text x="520" y="244" font-size="13" fill="#333">3. Claude assembles a phased CLI script</text>
  <text x="520" y="266" font-size="13" fill="#333">4. Suggest clarifying questions</text>
  <text x="520" y="296" font-size="13" fill="#333">Order: ONBOARD → IF-PHYS → L2-SEG → FAB-SDN</text>
  <text x="520" y="316" font-size="13" fill="#333">→ L3-VIRT → SEC-ID → MGMT-OPS → DIAG-LOG</text>

  <line x1="245" y1="116" x2="245" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="715" y1="116" x2="715" y2="148" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="250" x2="462" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="481" y="240" text-anchor="middle" font-size="11" fill="#555">per bin</text>

  <!-- DB -->
  <rect x="30" y="390" width="430" height="110" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="245" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">PostgreSQL + pgvector</text>
  <text x="50" y="440" font-size="13" fill="#333">cli_mappings: one row per functional intent,</text>
  <text x="50" y="460" font-size="13" fill="#333">6 OS columns, notes, source, confidence, verified</text>
  <text x="50" y="482" font-size="13" fill="#333">Search modes: semantic · keyword · hybrid</text>
  <line x1="245" y1="352" x2="245" y2="388" stroke="#444" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Claude -->
  <rect x="500" y="390" width="430" height="110" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="715" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Claude API (Anthropic)</text>
  <text x="520" y="440" font-size="13" fill="#333">Zero-hallucination policy: only commands</text>
  <text x="520" y="460" font-size="13" fill="#333">present in retrieved database context;</text>
  <text x="520" y="482" font-size="13" fill="#333">unverified guesses only when asked, labeled</text>
  <line x1="460" y1="330" x2="560" y2="388" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>

  <line x1="715" y1="352" x2="715" y2="388" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- Data pipeline -->
  <rect x="30" y="540" width="900" height="76" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="480" y="563" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Data pipeline</text>
  <text x="480" y="585" text-anchor="middle" font-size="13" fill="#333">Research (Google, NotebookLM) → 9 seed CSVs → embeddings (all-MiniLM-L6-v2, 384-dim) → database</text>
  <text x="480" y="604" text-anchor="middle" font-size="13" fill="#333">Growth tools: PDF extractor (vendor CLI guides) · document-aware web crawler</text>
  <line x1="245" y1="538" x2="245" y2="502" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
